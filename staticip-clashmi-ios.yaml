# ========================
# 规则引擎（rules）
# ========================

rules:
  # ==================================================
  # 1. 私有网络及本地应用
  # ==================================================
  - GEOSITE,private,全球直连
  - GEOIP,private,全球直连,no-resolve
  - RULE-SET,Applications,全球直连

  # ==================================================
  # 2. 用户自定义强制规则
  # ==================================================
  # 用户自行维护的直连规则，优先于后续公共规则
  - RULE-SET,User_Direct,用户直连

  # 指定域名强制走新加坡住宅代理
  - RULE-SET,SG_Residential_B,住宅代理备用

  # Claude Code 精确规则优先于通用 AI 分类
  - RULE-SET,ClaudeCode,AI服务

  # ==================================================
  # 3. Bilibili 主站与授权接口
  # ==================================================
  - DOMAIN-SUFFIX,bilibili.com,BiliBili_Direct
  - DOMAIN-SUFFIX,bilibili.net,BiliBili_Direct
  - DOMAIN-SUFFIX,biliapi.com,BiliBili_Direct
  - DOMAIN-SUFFIX,biliapi.net,BiliBili_Direct
