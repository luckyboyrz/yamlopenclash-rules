# ========================
# DNS 设置
# ========================
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # 仅解析 DNS 上游自身的域名，并覆盖 Mihomo 内置的引导解析器列表。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 未命中 nameserver-policy 的常规域名首先使用境内加密 DNS。
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 已明确属于境外的域名直接使用国际加密 DNS。
  nameserver-policy:
    'geosite:geolocation-!cn':
      - https://v.recipes/dns-cn
      - https://v.recipes/dns-query
      - https://doh.dns.sb/dns-query
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query
      - https://doh.opendns.com/dns-query
      - https://dns.quad9.net/dns-query
      - https://v.recipes/dns/doh.dns.sb/dns-query
      - https://v.recipes/dns/dns.cloudflare.com/dns-query
      - https://v.recipes/dns/dns.google/dns-query
      - https://v.recipes/dns/doh.opendns.com/dns-query
      - https://v.recipes/dns/dns.quad9.net/dns-query
      # - https://dns.alidns.com/dns-query
      # - https://doh.pub/dns-query

  # 未分类域名在境内解析失败或返回非 CN IP 时使用此后备池。
  fallback:
    - https://v.recipes/dns-cn
    - https://v.recipes/dns-query
    - https://doh.dns.sb/dns-query
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
    - https://doh.opendns.com/dns-query
    - https://dns.quad9.net/dns-query
    - https://v.recipes/dns/doh.dns.sb/dns-query
    - https://v.recipes/dns/dns.cloudflare.com/dns-query
