rule-providers:
  User_Direct:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/luckyboyrz/yamlopenclash-rules@main/rules/user-direct.yaml
    path: ./providers/user-direct.yaml
    interval: 86400
  SG_Residential_B:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/luckyboyrz/yamlopenclash-rules@main/rules/sg-residential-b.yaml
    path: ./providers/sg-residential-b.yaml
    interval: 86400
  Proxy:
    type: http
    behavior: domain
    # Use jsDelivr's Fastly endpoint instead of cdn.jsdelivr.net for iOS.
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt
    path: ./providers/proxy.yaml
    interval: 86400
  Applications:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt
    path: ./providers/applications.yaml
    interval: 86400
  ClaudeCode:
    type: http
    behavior: classical
    url: https://cdn.jsdelivr.net/gh/luckyboyrz/yamlopenclash-rules@main/rules/ClaudeCodeRule.yaml
    path: ./providers/ClaudeCodeRule.yaml
    interval: 86400
