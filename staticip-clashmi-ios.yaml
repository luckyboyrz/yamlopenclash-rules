    - 日本-故转
    - 新加坡-故转
    - 韩国-故转
    - 美国-故转
    - 英国-故转
    - 其他-故转
    - 拒绝

risk-default: &risk-default
  type: select
  proxies:
    - 直连
    # - 美国住宅代理
